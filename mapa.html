<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
 html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
 #map{position:absolute;inset:0}
 .hdr{position:absolute;z-index:1000;left:10px;top:10px;right:10px;background:rgba(255,255,255,.94);
      border-radius:12px;padding:9px 13px;box-shadow:0 2px 10px rgba(0,0,0,.25);
      display:flex;align-items:center;gap:11px;padding-top:max(9px,env(safe-area-inset-top))}
 .hdr b{font-size:15px;color:#8d1b1b}
 .hdr span{display:block;font-size:12.5px;color:#444;margin-top:2px}
 .back{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;background:#8d1b1b;color:#fff;
      border:0;border-radius:10px;padding:9px 13px;font-size:14px;font-weight:700;
      text-decoration:none;cursor:pointer;font-family:inherit}
 .htx{min-width:0}
 .pin{background:#8d1b1b;color:#fff;border-radius:50%;width:26px;height:26px;line-height:26px;
      text-align:center;font-weight:700;font-size:13px;border:2px solid #fff;
      box-shadow:0 1px 4px rgba(0,0,0,.5)}
 .pin.lunch{background:#b8860b;font-size:15px}
 .tabs{position:absolute;z-index:1000;left:10px;bottom:14px;right:10px;display:flex;gap:6px;justify-content:center}
 .tabs a{background:rgba(255,255,255,.94);border-radius:9px;padding:7px 12px;font-size:13px;
         font-weight:600;color:#8d1b1b;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
 .tabs a.on{background:#8d1b1b;color:#fff}
</style></head><body>
<div id="map"></div>
<div class="hdr">
  <button class="back" id="bk" type="button">‹ Späť</button>
  <div class="htx"><b id="ht"></b><span id="hs"></span></div>
</div>
<div class="tabs" id="tabs"></div>

name": "Palacio de Velázquez", "t": "09:50"}, {"n": 4, "lat": 40.4132, "lon": -3.6825, "name": "Palacio de Cristal", "t": "10:15"}, {"n": 5, "lat": 40.411, "lon": -3.6858, "name": "La Rosaleda + Fuente del Ángel Caído", "t": "10:50"}, {"n": 6, "lat": 40.4225, "lon": -3.6878, "name": "Plaza de la Independencia a Calle Serrano", "t": "11:20"}, {"n": 7, "lat": 40.4265, "lon": -3.6873, "name": "Calle Serrano — nákupy", "t": "11:40"}, {"n": 8, "lat": 40.4272, "lon": -3.6828, "name": "Mercado de la Paz", "t": "12:45"}, {"n": 9, "lat": 40.4272, "lon": -3.6828, "name": "OBED — Casa Dani", "t": "13:00"}, {"n": 10, "lat": 40.4249, "lon": -3.6851, "name": "Calle Jorge Juan + Callejón de Puigcerdá", "t": "14:20"}, {"n": 11, "lat": 40.4353, "lon": -3.6928, "name": "Museo Sorolla", "t": "15:00"}, {"n": 12, "lat": 40.4249, "lon": -3.6899, "name": "Paseo de la Castellana a Plaza de Colón", "t": "16:45"}, {"n": 13, "lat": 40.4238, "lon": -3.6896, "name": "Biblioteca Nacional a Museo Arqueológico", "t": "17:30"}, {"n": 14, "lat": 40.4249, "lon": -3.6899, "name": "Plaza de Colón", "t": "18:00"}]}, {"n": 5, "date": "Streda 9. 9. 2026", "theme": "Malasaña, Chueca, Gran Vía a Barrio de las Letras", "km": "6 km", "lunch": {"lat": 40.4257, "lon": -3.7043, "name": "Casa Macareno"}, "stops": [{"n": 1, "lat": 40.4267, "lon": -3.7035, "name": "Plaza del Dos de Mayo", "t": "09:00"}, {"n": 2, "lat": 40.4256, "lon": -3.7043, "name": "Malasaña — Calle de la Palma a Espíritu Santo", "t": "09:30"}, {"n": 3, "lat": 40.426, "lon": -3.7003, "name": "Museo de Historia de Madrid", "t": "10:15"}, {"n": 4, "lat": 40.4241, "lon": -3.7013, "name": "Calle Fuencarral", "t": "10:45"}, {"n": 5, "lat": 40.4222, "lon": -3.6968, "name": "Plaza de Chueca + Calle Augusto Figueroa", "t": "11:45"}, {"n": 6, "lat": 40.4213, "lon": -3.697, "name": "Mercado de San Antón", "t": "12:15"}, {"n": 7, "lat": 40.4256, "lon": -3.6989, "name": "Museo del Romanticismo (voliteľné)", "t": "13:00"}, {"n": 8, "lat": 40.4257, "lon": -3.7043, "name": "OBED — Casa Macareno", "t": "13:30"}, {"n": 9, "lat": 40.4189, "lon": -3.6981, "name": "Gran Vía — Edificio Metrópolis", "t": "15:00"}, {"n": 10, "lat": 40.4184, "lon": -3.6963, "name": "Círculo de Bellas Artes — Azotea", "t": "15:45"}, {"n": 11, "lat": 40.4192, "lon": -3.6931, "name": "Plaza de Cibeles + Palacio de Cibeles", "t": "16:30"}, {"n": 12, "lat": 40.4142, "lon": -3.6975, "name": "Barrio de las Letras — Calle Huertas", "t": "17:00"}, {"n": 13, "lat": 40.4147, "lon": -3.7008, "name": "Plaza de Santa Ana", "t": "17:30"}, {"n": 14, "lat": 40.4147, "lon": -3.7008, "name": "Koniec — Plaza de Santa Ana", "t": "18:00"}]}];
const q = new URLSearchParams(location.search);
const dn = Math.min(5, Math.max(1, parseInt(q.get('d') || '1')));
const bare = q.get('bare') === '1';
const D = DAYS.find(x => x.n === dn) || DAYS[0];

const map = L.map('map', {zoomControl: !bare, attributionControl: true});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap'
}).addTo(map);

const line = D.stops.map(s => [s.lat, s.lon]);
L.polyline(line, {color:'#8d1b1b', weight:4, opacity:.85, dashArray:'1,0'}).addTo(map);

function pin(lat, lon, label, cls, title) {
  L.marker([lat, lon], {icon: L.divIcon({className:'', html:'<div class="pin '+cls+'">'+label+'</div>',
    iconSize:[26,26], iconAnchor:[13,13]})}).addTo(map).bindPopup(title);
}
const near = (a, b) => Math.abs(a.lat-b.lat) < 0.0003 && Math.abs(a.lon-b.lon) < 0.0003;
let lunchShown = false;
D.stops.forEach(s => {
  const isL = near(s, D.lunch);
  if (isL) lunchShown = true;
  pin(s.lat, s.lon, s.n, isL ? 'lunch' : '',
      '<b>'+s.n+'. '+s.name+'</b><br>'+s.t + (isL ? '<br>\uD83C\uDF7D ' + D.lunch.name : ''));
});
if (!lunchShown) pin(D.lunch.lat, D.lunch.lon, '\u25CF', 'lunch', '<b>Obed:</b> ' + D.lunch.name);

map.fitBounds(L.latLngBounds(line.concat([[D.lunch.lat, D.lunch.lon]])),
  {paddingTopLeft:[46,92], paddingBottomRight:[46,54]});

document.getElementById('ht').textContent = 'Deň ' + D.n + ' \u2013 ' + D.date;
document.getElementById('hs').textContent = D.theme + (D.km ? '  \u00B7  ' + D.km : '');
if (!bare) {
  document.getElementById('tabs').innerHTML = DAYS.map(x =>
    '<a href="?d='+x.n+'" class="'+(x.n===dn?'on':'')+'">'+x.n+'. deň</a>').join('');
  /* návrat do programu — vždy na index appky, aj keď sa mapa otvorila v novom okne */
  document.getElementById('bk').addEventListener('click', function () {
    location.href = './?d=' + dn;
  });
} else {
  document.getElementById('tabs').style.display = 'none';
  document.getElementById('bk').style.display = 'none';
}
</script></body></html>
